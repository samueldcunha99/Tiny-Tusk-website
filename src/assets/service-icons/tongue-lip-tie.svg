<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 5 44 44">
  <defs>
    <style>
      .tlt-base {
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.6px;
        stroke-miterlimit: 10;
      }
      .tlt-accent {
        fill: none;
        stroke: var(--tt-coral);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.5px;
      }
    </style>
  </defs>
  <g>
    <!-- Soft Baby/Toddler Head Outline -->
    <path class="tlt-base" d="M14,24 C14,14 20,11 27,11 C34,11 40,14 40,24 C40,34 34,39 27,39 C20,39 14,34 14,24 Z" />
    <!-- Cheerful Hair Curl -->
    <path class="tlt-base" d="M27,11 C25,7 21,7 20,9" />
    <!-- Happy Smiling Eye Arches -->
    <path class="tlt-base" d="M19,21 C20.5,18.5 23,18.5 24.5,21" />
    <path class="tlt-base" d="M29.5,21 C31,18.5 33.5,18.5 35,21" />
    <!-- Wide Open Warm Smile -->
    <path class="tlt-base" d="M20.5,26 C22.5,33 31.5,33 33.5,26" />
    <!-- Playful Tongue Peeking Out Freely (Full Mobility) -->
    <path class="tlt-base" d="M24,28.5 C24,33.5 30,33.5 30,28.5" />
    <line class="tlt-base" x1="27" y1="29" x2="27" y2="31.5" />
    <!-- Tiny Tusk Coral Sparkle Accent -->
    <path class="tlt-accent" d="M39,7 L39,13 M36,10 L42,10" />
  </g>
</svg>
