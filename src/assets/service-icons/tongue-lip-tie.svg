<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 2 50 37">
  <defs>
    <style>
      .tlt-line {
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7px;
        stroke-miterlimit: 10;
      }
    </style>
  </defs>
  <g>
    <!-- Upper Lip (Continuous clean outline meeting at sharp corners) -->
    <path class="tlt-line" d="M 1,13.5 C 5,7.5 12,3.5 16.5,3.5 C 19.5,3.5 22.5,5.5 25,5.5 C 27.5,5.5 30.5,3.5 33.5,3.5 C 38,3.5 45,7.5 49,13.5 C 42,10.2 34,9.2 25,9.2 C 16,9.2 8,10.2 1,13.5 Z" />

    <!-- Left Corner & Lower Lip Wing -->
    <path class="tlt-line" d="M 1,13.5 C 3.5,18 6,22 10.5,25.5 C 9.5,21.5 9.5,17.5 12,14" />

    <!-- Right Corner & Lower Lip Wing -->
    <path class="tlt-line" d="M 49,13.5 C 46.5,18 44,22 39.5,25.5 C 40.5,21.5 40.5,17.5 38,14" />

    <!-- Tongue Outline (Smooth U-Shape sticking out) -->
    <path class="tlt-line" d="M 12,13.8 C 11.2,19.5 12,26 15.5,31.5 C 18,35.2 21.2,36.8 25,36.8 C 28.8,36.8 32,35.2 34.5,31.5 C 38,26 38.8,19.5 38,13.8" />

    <!-- Tongue Top Crest (Arch inside mouth) -->
    <path class="tlt-line" d="M 12,13.8 C 15.5,11.8 20,11.5 25,12.2 C 30,11.5 34.5,11.8 38,13.8" />

    <!-- Tongue Center Crease -->
    <line class="tlt-line" x1="25" y1="14.5" x2="25" y2="26.5" />
  </g>
</svg>
