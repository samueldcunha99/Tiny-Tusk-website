<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiny Tusk Pediatric Dental Clinic</title>
    <meta
      name="description"
      content="Gentle care for growing smiles. Tiny Tusk is a pediatric dental clinic where little smiles are cared for with kindness, patience and a whole lot of heart."
    />
    <meta name="theme-color" content="#18528E" />

    <!--
      The mark reversed out of cobalt, rather than the bare cobalt stroke on
      transparent it used to be. On transparent, Google composited it onto its
      own white circle and the thin strokes came out muddy at search-result
      size; a solid cobalt field with a white mark holds up all the way down to
      a 16px tab.

      The full cover roundel (p1) was tried here and abandoned: its arc text and
      "Pediatric Dental Clinic" line turn to mush below about 48px.

      SVG first, since a mark with no type in it needs no webfont and so stays
      sharp at any size. The PNGs are for Google, which wants a square raster
      of at least 48px -- 192 is the one it uses in search results.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="/" />
    <link
      rel="preload"
      href="/fonts/montserrat-100-900.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/encode-sans-condensed-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tiny Tusk Pediatric Dental Clinic" />
    <meta
      property="og:description"
      content="Gentle care for growing smiles. A dental experience that feels safe, gentle and even a little magical."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tiny Tusk Pediatric Dental Clinic" />
    <meta
      name="twitter:description"
      content="Gentle care for growing smiles. A dental experience that feels safe, gentle and even a little magical."
    />
    <meta name="twitter:image" content="/og-image.png" />

  </head>
